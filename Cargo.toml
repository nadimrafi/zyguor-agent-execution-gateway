[package]
name = "zyguor-agent-execution-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
wasmtime = "48.0.1"
git2 = "0.21.0"
libc = "0.2.189"
